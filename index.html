<!-- ===================== SIRI MESH LIQUID (Canvas) ===================== -->
<script>
const canvas = document.getElementById("aiMesh") || document.createElement("canvas");
if (!document.getElementById("aiMesh")) {
  canvas.id = "aiMesh";
  document.body.appendChild(canvas);
}

const ctx = canvas.getContext("2d");

let W, H;

function resizeMesh() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeMesh();
window.addEventListener("resize", resizeMesh);

// Siri Mesh nodes
let nodes = [];
for (let i = 0; i < 90; i++) {
  nodes.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 1.2,
    vy: (Math.random() - 0.5) * 1.2,
    c: `hsla(${Math.random()*360}, 85%, 65%, 0.8)`
  });
}

function meshLoop() {
  ctx.clearRect(0, 0, W, H);

  for (let n of nodes) {
    n.x += n.vx;
    n.y += n.vy;

    if (n.x < 0 || n.x > W) n.vx *= -1;
    if (n.y < 0 || n.y > H) n.vy *= -1;

    // node
    ctx.beginPath();
    ctx.fillStyle = n.c;
    ctx.arc(n.x, n.y, 2.4, 0, Math.PI * 2);
    ctx.fill();

    // links
    for (let n2 of nodes) {
      let dx = n.x - n2.x;
      let dy = n.y - n2.y;
      let dist = dx*dx + dy*dy;

      if (dist < 16000) {
        ctx.strokeStyle = n.c;
        ctx.globalAlpha = .08;
        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        ctx.lineTo(n2.x, n2.y);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }
  requestAnimationFrame(meshLoop);
}
meshLoop();
</script>

<!-- ===================== ORBS (VisionOS Style) ===================== -->
<script>
const orbs = document.querySelectorAll('.orb');

function orbit(e) {
  const x = (e.clientX / window.innerWidth) - 0.5;
  const y = (e.clientY / window.innerHeight) - 0.5;

  orbs.forEach((orb, i) => {
    const power = (i + 1) * 40;
    orb.style.transform = `translate(${x * power}px, ${y * power}px)`;
  });
}

window.addEventListener("mousemove", orbit);
window.addEventListener("touchmove", e => {
  if (!e.touches[0]) return;
  orbit({
    clientX: e.touches[0].clientX,
    clientY: e.touches[0].clientY
  });
});

// VisionOS parallax
window.addEventListener("scroll", () => {
  const sc = window.scrollY;
  orbs.forEach((o, i) => {
    o.style.transform += ` translateY(${sc * 0.03 * (i + 1)}px)`;
  });
});
</script>

<!-- ===================== GSAP ===================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- ===================== TITLE / CARD REVEAL ===================== -->
<script>
gsap.registerPlugin(ScrollTrigger);

// Loader hide
window.addEventListener("load", () => {
  const l = document.getElementById("loader");
  if (l) l.classList.add("hidden");
});

// Cards reveal
gsap.utils.toArray(".card").forEach((c, i) => {
  gsap.from(c, {
    scrollTrigger: { trigger: c, start: "top 90%" },
    opacity: 0,
    y: 50,
    duration: 1.2,
    ease: "power3.out"
  });
});

// Title per-letter reveal
function animateTitles() {
  const titles = document.querySelectorAll(".section-title");

  titles.forEach(title => {
    const text = title.innerText.trim();
    title.innerHTML = text
      .split("")
      .map(c => `<span class="char">${c === " " ? "&nbsp;" : c}</span>`)
      .join("");

    gsap.fromTo(
      title.querySelectorAll(".char"),
      { opacity: 0, y: 30 },
      {
        scrollTrigger: { trigger: title, start: "top 85%" },
        opacity: 1,
        y: 0,
        duration: 1.2,
        stagger: 0.02,
        ease: "power3.out"
      }
    );
  });
}
animateTitles();
</script>

<!-- ===================== MENU VISIONOS MOBILE ===================== -->
<script>
const menuBtn = document.getElementById("menuToggle");
const visionPanel = document.getElementById("mobileMenu");

if (menuBtn) {
  menuBtn.addEventListener("click", () => {
    visionPanel.classList.toggle("open");
    menuBtn.classList.toggle("active");
  });
}

document.querySelectorAll('#mobileMenu a').forEach(link => {
  link.addEventListener("click", () => {
    visionPanel.classList.remove("open");
    menuBtn.classList.remove("active");
  });
});

// Dark / Light override toggle
const modeBtn = document.getElementById("modeToggle");

if (modeBtn) {
  modeBtn.addEventListener("click", () => {
    document.documentElement.classList.toggle("dark-mode");
    modeBtn.textContent =
      document.documentElement.classList.contains("dark-mode") ? "☀️" : "🌙";
  });
}
</script>
<!-- ===================== APPLE INTELLIGENCE OPTIMIZATIONS ===================== -->
<script>
/*  Smooth scroll (iOS / MacOS style)  */
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
  anchor.addEventListener("click", function(e){
    const target = document.querySelector(this.getAttribute("href"));
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

/*  Auto blur header on scroll (like iOS)  */
const header = document.querySelector("header");
window.addEventListener("scroll", () => {
  if (window.scrollY > 50) {
    header.style.backdropFilter = "blur(50px) saturate(1.8)";
    header.style.background = "rgba(255,255,255,0.35)";
  } else {
    header.style.backdropFilter = "blur(25px)";
    header.style.background = "var(--ai-white-glass)";
  }
});

/*  Auto Dark Mode Sync (VisionOS style)  */
if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
  document.documentElement.classList.add("dark-mode");
}
</script>
